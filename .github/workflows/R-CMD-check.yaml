# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: main
  pull_request:
    branches: main

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          #- {os: windows-latest, r: '4.5', rust-version: 'stable-msvc', rust-target: 'x86_64-pc-windows-gnu'}
          - {os: macos-latest,   r: '4.6', rust-version: 'stable', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.06'}
          - {os: ubuntu-latest,  r: '4.6', rust-version: 'stable', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.06'}
          - {os: ubuntu-latest,  r: '4.5', rust-version: 'stable', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.06'}
          - {os: ubuntu-latest,  r: '4.4', rust-version: 'stable', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.04'}
          - {os: ubuntu-latest,  r: '4.3', rust-version: 'stable', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/stratus/2025-05-09/'}
          - {os: ubuntu-latest,  r: '4.2', rust-version: 'stable', repo: 'https://prism.dev.a2-ai.cloud/rpkgs/stratus/2026-06-30'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RV_R_VERSION: ${{ matrix.config.r }}
      RV_R_BIN: R
      CRAN_REPOSITORY: ${{ matrix.config.repo }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.config.rust-version }}
          targets: ${{ matrix.config.rust-target }}

      - name: Ensure rustup cargo bin is first on PATH
        if: runner.os != 'Windows'
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Rust toolchain
        if: runner.os != 'Windows'
        run: |
          which rustup
          which rustc
          which cargo
          rustup show
          rustc --version
          cargo --version

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Use the Apple Silicon baseline for Rust, native dependencies, and R linking.
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      # Add rust-cache for faster builds
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust -> target
          shared-key: ${{ matrix.config.os }}-r${{ matrix.config.r }}-${{ matrix.config.rust-version }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: a2-ai/setup-rv@main

      - name: Configure repositories
        shell: bash
        run: |
          rv configure repository replace prism --alias prism --url "$CRAN_REPOSITORY"

      - name: rv-plan
        shell: bash
        run: rv plan

      - name: rv-sysdeps-install (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          MISSING_DEPS=$(rv plan --json | jq -r '.installed[].sys_deps[]? | select(.status == "absent") | .name')
          if [ -n "$MISSING_DEPS" ]; then
            echo "Found missing system dependencies:"
            echo "$MISSING_DEPS"
            echo "Installing..."
            echo "$MISSING_DEPS" | xargs sudo apt install
          else
            echo "All system dependencies are present"
          fi

      - name: rv-sync
        shell: bash
        run: rv sync

      - name: Use the rv library for package checks
        shell: bash
        run: |
          touch "$RUNNER_TEMP/empty.Rprofile"
          echo "R_PROFILE_USER=$RUNNER_TEMP/empty.Rprofile" >> "$GITHUB_ENV"
          echo "R_LIBS_USER=$GITHUB_WORKSPACE/$(rv library)" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
