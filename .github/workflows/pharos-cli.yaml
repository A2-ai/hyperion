# Checks for the bundled pharos CLI (design/pharos-cli-bundling.md, R44). Every
# pharos-CLI check lives here so release.yml (generated by `gh prism`),
# R-CMD-check.yaml and pharos-dependency-check.yaml stay at their stock
# contents. The logic lives in .github/scripts/ so each check can be run
# locally from the repo root.
on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:
  # Must match `name:` in release.yml. GitHub only fires workflow_run for
  # workflow files on the default branch, so release-artifacts starts running
  # once this file is merged to main.
  workflow_run:
    workflows: ["Release"]
    types: [completed]

name: pharos CLI

permissions: read-all

jobs:
  # Fails while the dev [patch] pointing pharos at a local checkout is present,
  # so the branch cannot merge until it is removed and Cargo.lock regenerated.
  no-dev-patch:
    name: No dev pharos patch (I11)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No dev pharos patch
        run: bash .github/scripts/check-no-dev-pharos-patch.sh src/rust

  cli-dep-graph:
    name: pharos CLI has no R dependencies (I1)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: hyperion-pharos-cli does not depend on extendr / libR-sys
        run: bash .github/scripts/check-cli-dep-graph.sh src/rust/Cargo.toml

  same-commit:
    name: pharos crates resolve to one commit (I4)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pharos crates (incl. CLI) resolve to one commit
        run: bash .github/scripts/check-pharos-same-commit.sh src/rust/Cargo.lock

  # Plant the outputs a local `R CMD INSTALL .` leaves behind; the built
  # tarball must still come out clean.
  source-tarball:
    name: Source tarball has no binaries (I5)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Plant build outputs of a local install
        run: |
          mkdir -p inst/bin src/rust/target/release
          for f in src/pharos src/pharos.exe inst/bin/pharos src/rust/target/release/pharos; do
            cp "$(type -P true)" "$f"
          done
          touch src/pharos-cli-skipped

      # Bypass the repo .Rprofile (it activates rv, which is not installed here).
      - name: Build source tarball
        run: |
          touch "$RUNNER_TEMP/empty.Rprofile"
          R_PROFILE_USER="$RUNNER_TEMP/empty.Rprofile" R CMD build --no-build-vignettes --no-manual --no-resave-data .

      - name: Source tarball has no binaries and no inst/bin
        run: bash .github/scripts/check-source-tarball.sh hyperion_*.tar.gz

  # A plain Linux install builds the CLI by default (D10) and installs
  # bin/pharos reporting Config/PharosVersion (D6, I2). Dependencies are set up
  # the way R-CMD-check.yaml does it (rv), minus the check itself.
  bundled-cli-linux:
    name: Linux install ships bin/pharos (D6/I2/D10)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RV_R_VERSION: "4.6"
      RV_R_BIN: R
      CRAN_REPOSITORY: https://prism.dev.a2-ai.cloud/rpkgs/nimbus/2026.06
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable

      - name: Ensure rustup cargo bin is first on PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust -> target
          shared-key: pharos-cli-linux
          cache-on-failure: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"

      - uses: a2-ai/setup-rv@main

      - name: Configure repositories
        shell: bash
        run: |
          rv configure repository replace prism --alias prism --url "$CRAN_REPOSITORY"

      - name: rv-sysdeps-install
        shell: bash
        run: |
          MISSING_DEPS=$(rv plan --json | jq -r '.installed[].sys_deps[]? | select(.status == "absent") | .name')
          if [ -n "$MISSING_DEPS" ]; then
            echo "Found missing system dependencies:"
            echo "$MISSING_DEPS"
            echo "Installing..."
            echo "$MISSING_DEPS" | xargs sudo apt install
          else
            echo "All system dependencies are present"
          fi

      - name: rv-sync
        shell: bash
        run: rv sync

      # Bypass the repo .Rprofile (it activates rv) and point R at rv's library.
      - name: Use the rv library
        shell: bash
        run: |
          touch "$RUNNER_TEMP/empty.Rprofile"
          echo "R_PROFILE_USER=$RUNNER_TEMP/empty.Rprofile" >> "$GITHUB_ENV"
          echo "R_LIBS_USER=$GITHUB_WORKSPACE/$(rv library)" >> "$GITHUB_ENV"

      # HYPERION_SKIP_PHAROS_CLI is deliberately unset: Linux builds the CLI by
      # default (D10, D12), and that default is what this job checks.
      - name: Install hyperion
        shell: bash
        env:
          NOT_CRAN: "true"
        run: |
          unset HYPERION_SKIP_PHAROS_CLI
          mkdir -p "$RUNNER_TEMP/lib"
          R CMD INSTALL --library="$RUNNER_TEMP/lib" .

      - name: Installed package ships bin/pharos at Config/PharosVersion
        shell: bash
        run: bash .github/scripts/check-bundled-pharos.sh "$RUNNER_TEMP/lib/hyperion"

  # Runs after the Release workflow finishes and checks what it uploaded. The
  # trade-off (R44): a bad artifact is detected after upload, not blocked.
  release-artifacts:
    name: Release assets ship bin/pharos, source has no binaries
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # A tag push (`on: push: tags: ['v*']`) runs Release with head_branch set
      # to the tag. A workflow_dispatch run takes the tag as an input, which
      # workflow_run does not expose; head_branch is then the dispatch ref, so
      # fall back to the most recently created release (prereleases included).
      - name: Resolve release tag
        id: tag
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "$HEAD_BRANCH" ] && gh release view "$HEAD_BRANCH" --json tagName >/dev/null 2>&1; then
            tag="$HEAD_BRANCH"
          else
            tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            echo "::warning::'$HEAD_BRANCH' is not a release tag; checking the most recent release, $tag"
          fi
          [ -n "$tag" ] || { echo "::error::could not resolve a release tag"; exit 1; }
          echo "Release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # r-releaser names assets <pkg>_<version>.tar.gz (source),
      # <pkg>_<version>_linux_<distro>_<arch>_<R>.tar.gz (Linux binaries) and
      # <pkg>_<version>_macos_<arch>_<R>.tgz (macOS binaries). Names taken from
      # the v0.6.0 release; release.yml only passes r-releaser's outputs
      # through. macOS skips the CLI by default (D10) and is not checked.
      - name: Download release assets
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets/linux" "$RUNNER_TEMP/assets/src"
          gh release download "$TAG" --pattern '*_linux_*.tar.gz' --dir "$RUNNER_TEMP/assets/linux"
          # The source asset has no platform suffix: exactly <pkg>_<version>.tar.gz.
          src=$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^[A-Za-z0-9.]+_[^_]+\.tar\.gz$' || true)
          if [ "$(grep -c . <<<"$src")" -ne 1 ]; then
            echo "::error::expected exactly one source tarball asset on $TAG, found: ${src:-(none)}"
            exit 1
          fi
          gh release download "$TAG" --pattern "$src" --dir "$RUNNER_TEMP/assets/src"
          ls -l "$RUNNER_TEMP"/assets/*

      # The CLI has no native -sys dependencies (I1), so the almalinux8 binary
      # needs only glibc and runs on the newer ubuntu runner.
      - name: Linux binaries ship bin/pharos at Config/PharosVersion
        run: |
          shopt -s nullglob
          bins=("$RUNNER_TEMP"/assets/linux/*.tar.gz)
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "::error::no Linux binary assets (*_linux_*.tar.gz) on the release"
            exit 1
          fi
          fail=0
          for b in "${bins[@]}"; do
            echo "== $(basename "$b")"
            bash .github/scripts/check-bundled-pharos.sh "$b" || fail=1
          done
          exit "$fail"

      - name: Source tarball has no binaries (I5)
        run: bash .github/scripts/check-source-tarball.sh "$RUNNER_TEMP"/assets/src/*.tar.gz
