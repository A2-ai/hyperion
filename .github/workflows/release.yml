name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string
      publish:
        description: Deploy a prerelease (rc or dev) tag to PRISM
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ===========================================================================
  # PREFLIGHT
  # Resolves the tag, classifies prereleases (release candidates and dev
  # versions), and warns when the repo disagrees with what this workflow was
  # generated from.
  # ===========================================================================
  preflight:
    name: Preflight release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_rc: ${{ steps.tag.outputs.is_rc }}
      is_dev: ${{ steps.tag.outputs.is_dev }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # KEEP IN SYNC: IsReleaseCandidate and IsDevTag in gh-prism internal/config/plan.go
          is_rc=false; is_dev=false; is_prerelease=false
          if [[ "$TAG" =~ -rc[0-9]*$ ]]; then is_rc=true; fi
          # A dev tag's last dot-component is 9000-9999: exactly four digits starting with 9.
          if [[ "$TAG" =~ \.9[0-9]{3}$ ]]; then is_dev=true; fi
          if [ "$is_rc" = true ] || [ "$is_dev" = true ]; then is_prerelease=true; fi
          { echo "is_rc=$is_rc"; echo "is_dev=$is_dev"; echo "is_prerelease=$is_prerelease"; } >> "$GITHUB_OUTPUT"

      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          sparse-checkout: |
            .github/prism.yml
            DESCRIPTION
          sparse-checkout-cone-mode: false

      - name: Check .github/prism.yml is what this workflow was generated from
        run: |
          want="5a5071cc2cb5b9c705afba8bf0fc09d39be4437f849fecbf32b4b75b981ecaa9"
          got="$(sha256sum .github/prism.yml | cut -d' ' -f1)"
          if [ "$got" != "$want" ]; then
            echo "::warning file=.github/prism.yml::.github/prism.yml changed after this workflow was generated — run 'gh prism init --force' and commit both files. This release runs with the settings baked into the workflow."
          fi

      - name: Check DESCRIPTION version matches the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)"
          # KEEP IN SYNC: devVersion in gh-prism internal/release/version.go —
          # an -rcN tag's DESCRIPTION carries the dev version <last release>.$((9000+N)).
          if [[ "$TAG" =~ -rc([0-9]*)$ ]]; then
            n="${BASH_REMATCH[1]}"
            if [ -n "$n" ]; then
              # 10# reads a leading-zero N (v1.2.3-rc08) as decimal, not invalid octal.
              suffix=".$((9000 + 10#$n))"
              if [[ "$version" != *"$suffix" ]]; then
                echo "::warning file=DESCRIPTION::DESCRIPTION says Version: $version but release candidate tag $TAG expects a dev version ending in $suffix."
              fi
            fi
          elif [ "$version" != "${TAG#v}" ]; then
            echo "::warning file=DESCRIPTION::DESCRIPTION says Version: $version but tag $TAG names ${TAG#v}."
          fi

      - name: Check PRISM deploy credentials
        env:
          PRISM_API_URL: ${{ vars.PRISM_API_URL }}
          PRISM_API_TOKEN_DEV: ${{ secrets.PRISM_API_TOKEN_DEV }}
        run: |
          fail=0
          if [ -z "$PRISM_API_URL" ]; then
            echo "::error::Actions variable PRISM_API_URL is not set — set it once per org (or per repo to override)."
            fail=1
          fi
          if [ -z "$PRISM_API_TOKEN_DEV" ]; then
            echo "::error::Actions secret PRISM_API_TOKEN_DEV is not set or not shared with this repository — create it at the org level and grant this repository access."
            fail=1
          fi
          exit $fail

  # ===========================================================================
  # BUILD-PRIMARY
  # Builds the source tarball plus the primary platform's binary
  # (platforms[0] x r_versions[0] from prism.yml).
  # ===========================================================================
  build-primary:
    name: "build (almalinux8-x86_64 / R 4.6)"
    needs: preflight
    runs-on: "ubuntu-latest"
    container: "almalinux:8"
    permissions:
      contents: write
    env:
      BUILD_R: "4.6"
      BUILD_CONTAINER: "almalinux:8"
    outputs:
      tarball_name: ${{ steps.build-src.outputs.tarball_name }}
      linking_to_deps: ${{ steps.build-src.outputs.linking_to_deps }}
      package_name: ${{ steps.pkg-info.outputs.name }}
      package_version: ${{ steps.pkg-info.outputs.version }}
    steps:
      - name: Prepare container
        if: env.BUILD_CONTAINER != ''
        shell: bash
        run: |
          command -v curl >/dev/null && exit 0
          if command -v dnf >/dev/null; then dnf install -y curl
          elif command -v microdnf >/dev/null; then microdnf install -y curl
          elif command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
          elif command -v zypper >/dev/null; then zypper --non-interactive install curl
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.preflight.outputs.tag }}

      - name: Setup R (container)
        if: env.BUILD_CONTAINER != ''
        shell: bash
        run: |
          curl -Ls https://github.com/r-lib/rig/releases/download/v0.8.1/rig-linux-0.8.1.tar.gz | tar xz -C /usr/local
          rig add "$BUILD_R"
          echo "/opt/R/${BUILD_R}/bin" >> "$GITHUB_PATH"

      - name: Setup R (bare-metal)
        if: env.BUILD_CONTAINER == ''
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.BUILD_R }}

      - name: Install rv
        uses: a2-ai/setup-rv@v1.0.0

      # Evicts Homebrew, pins Xcode, and installs gfortran plus CRAN-compatible
      # static sysdeps, so the binary links like a CRAN macOS build.
      - name: Prepare macOS for static linking
        if: env.BUILD_CONTAINER == '' && runner.os == 'macOS'
        uses: a2-ai/r-gh-mac-build/prep@main
        with:
          r-version: ${{ env.BUILD_R }}

      - name: Setup build environment
        uses: A2-ai/r-releaser/setup-build-env@feat/gh-compatibility
        with:
          toolchain: "auto"
          rust: "auto"
          sysdeps: "auto"
          sysdeps_ignore: "libgit2_1.7-devel pandoc"
          sysdeps_extra: "libgit2-devel libcurl-devel"

      - name: Pin R version in rproject.toml (container)
        if: env.BUILD_CONTAINER != ''
        shell: bash
        run: sed -i "s|^r_version = \".*\"$|r_version = \"$BUILD_R\"|" rproject.toml

      - name: Pin R version in rproject.toml (bare-metal)
        if: env.BUILD_CONTAINER == ''
        shell: bash
        run: perl -i -pe 's|^r_version = ".*"$|r_version = "$ENV{BUILD_R}"|' rproject.toml

      - name: Sync R dependencies
        shell: bash
        run: rv sync

      - name: Get library path
        id: library
        shell: bash
        run: echo "result=$(rv library)" >> "$GITHUB_OUTPUT"

      - name: Get package info from DESCRIPTION
        id: pkg-info
        shell: bash
        run: |
          echo "name=$(sed -n 's/^Package:[[:space:]]*//p' DESCRIPTION)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)" >> "$GITHUB_OUTPUT"

      - name: Build source tarball
        id: build-src
        uses: A2-ai/r-releaser/build-src@feat/gh-compatibility
        with:
          library: ${{ steps.library.outputs.result }}
          resave-data: false
          md5: true
          user: r-releaser
          build-vignettes: false
          metadata: |
            {
              "PrismRemoteType": "git",
              "PrismRemoteRef": "${{ needs.preflight.outputs.tag }}",
              "PrismRemoteSha": "${{ github.sha }}"
            }

      - name: Upload source tarball to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build-src.outputs.tarball_path }}
          asset_name: ${{ steps.build-src.outputs.tarball_name }}
          tag: ${{ needs.preflight.outputs.tag }}
          release_name: ${{ needs.preflight.outputs.tag }}
          overwrite: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.is_prerelease == 'true' && 'false' || 'legacy' }}

      - name: Upload source tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: ${{ steps.build-src.outputs.tarball_path }}
          if-no-files-found: error

      - name: Build binary
        id: build-bin
        uses: A2-ai/r-releaser/build-bin@feat/gh-compatibility
        with:
          library: ${{ steps.library.outputs.result }}
          src_tarball_path: ${{ steps.build-src.outputs.tarball_path }}
          linking_to_deps: ${{ steps.build-src.outputs.linking_to_deps }}
          no_sys_deps: true

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build-bin.outputs.binary_path }}
          asset_name: ${{ steps.build-bin.outputs.binary_name }}
          tag: ${{ needs.preflight.outputs.tag }}
          release_name: ${{ needs.preflight.outputs.tag }}
          overwrite: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.is_prerelease == 'true' && 'false' || 'legacy' }}

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "manifest-almalinux8-x86_64-r4.6"
          path: manifest.json
          if-no-files-found: error

  # ===========================================================================
  # BUILD-BIN (matrix)
  # Builds a binary from the primary job's source tarball for every other
  # platform x R version pair.
  # ===========================================================================
  build-bin:
    name: build (${{ matrix.config.name }} / R ${{ matrix.config.r }})
    needs: [preflight, build-primary]
    runs-on: ${{ matrix.config.runner }}
    container: ${{ matrix.config.container || '' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - {"name":"almalinux8-x86_64","runner":"ubuntu-latest","container":"almalinux:8","os_release_id":"almalinux","arch":"x86_64","r":"4.5","sysdeps":"auto","sysdeps_ignore":"libgit2_1.7-devel pandoc","sysdeps_extra":"libgit2-devel libcurl-devel","toolchain":"auto","rust":"auto"}
          - {"name":"almalinux8-x86_64","runner":"ubuntu-latest","container":"almalinux:8","os_release_id":"almalinux","arch":"x86_64","r":"4.4","sysdeps":"auto","sysdeps_ignore":"libgit2_1.7-devel pandoc","sysdeps_extra":"libgit2-devel libcurl-devel","toolchain":"auto","rust":"auto"}
          - {"name":"macos-arm64","runner":"macos-15","container":null,"os_release_id":null,"arch":"arm64","r":"4.6","sysdeps":"none","sysdeps_ignore":"","sysdeps_extra":"","toolchain":"auto","rust":"auto"}
          - {"name":"macos-arm64","runner":"macos-15","container":null,"os_release_id":null,"arch":"arm64","r":"4.5","sysdeps":"none","sysdeps_ignore":"","sysdeps_extra":"","toolchain":"auto","rust":"auto"}
          - {"name":"macos-arm64","runner":"macos-15","container":null,"os_release_id":null,"arch":"arm64","r":"4.4","sysdeps":"none","sysdeps_ignore":"","sysdeps_extra":"","toolchain":"auto","rust":"auto"}
    env:
      BUILD_R: ${{ matrix.config.r }}
      BUILD_CONTAINER: ${{ matrix.config.container || '' }}
    steps:
      - name: Prepare container
        if: env.BUILD_CONTAINER != ''
        shell: bash
        run: |
          command -v curl >/dev/null && exit 0
          if command -v dnf >/dev/null; then dnf install -y curl
          elif command -v microdnf >/dev/null; then microdnf install -y curl
          elif command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
          elif command -v zypper >/dev/null; then zypper --non-interactive install curl
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.preflight.outputs.tag }}

      - name: Setup R (container)
        if: env.BUILD_CONTAINER != ''
        shell: bash
        run: |
          curl -Ls https://github.com/r-lib/rig/releases/download/v0.8.1/rig-linux-0.8.1.tar.gz | tar xz -C /usr/local
          rig add "$BUILD_R"
          echo "/opt/R/${BUILD_R}/bin" >> "$GITHUB_PATH"

      - name: Setup R (bare-metal)
        if: env.BUILD_CONTAINER == ''
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.BUILD_R }}

      - name: Install rv
        uses: a2-ai/setup-rv@v1.0.0

      # Evicts Homebrew, pins Xcode, and installs gfortran plus CRAN-compatible
      # static sysdeps, so the binary links like a CRAN macOS build.
      - name: Prepare macOS for static linking
        if: env.BUILD_CONTAINER == '' && runner.os == 'macOS'
        uses: a2-ai/r-gh-mac-build/prep@main
        with:
          r-version: ${{ env.BUILD_R }}

      - name: Setup build environment
        uses: A2-ai/r-releaser/setup-build-env@feat/gh-compatibility
        with:
          toolchain: ${{ matrix.config.toolchain }}
          rust: ${{ matrix.config.rust }}
          sysdeps: ${{ matrix.config.sysdeps }}
          sysdeps_ignore: ${{ matrix.config.sysdeps_ignore }}
          sysdeps_extra: ${{ matrix.config.sysdeps_extra }}

      - name: Pin R version in rproject.toml (container)
        if: env.BUILD_CONTAINER != ''
        shell: bash
        run: sed -i "s|^r_version = \".*\"$|r_version = \"$BUILD_R\"|" rproject.toml

      - name: Pin R version in rproject.toml (bare-metal)
        if: env.BUILD_CONTAINER == ''
        shell: bash
        run: perl -i -pe 's|^r_version = ".*"$|r_version = "$ENV{BUILD_R}"|' rproject.toml

      - name: Sync R dependencies
        shell: bash
        run: rv sync

      - name: Get library path
        id: library
        shell: bash
        run: echo "result=$(rv library)" >> "$GITHUB_OUTPUT"

      - name: Download source tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: dist-src

      - name: Verify source tarball path
        id: src-tarball
        shell: bash
        run: |
          SRC_PATH="$GITHUB_WORKSPACE/dist-src/${{ needs.build-primary.outputs.tarball_name }}"
          test -f "$SRC_PATH"
          echo "path=$SRC_PATH" >> "$GITHUB_OUTPUT"

      - name: Build binary
        id: build-bin
        uses: A2-ai/r-releaser/build-bin@feat/gh-compatibility
        with:
          library: ${{ steps.library.outputs.result }}
          src_tarball_path: ${{ steps.src-tarball.outputs.path }}
          linking_to_deps: ${{ needs.build-primary.outputs.linking_to_deps }}
          no_sys_deps: true

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build-bin.outputs.binary_path }}
          asset_name: ${{ steps.build-bin.outputs.binary_name }}
          tag: ${{ needs.preflight.outputs.tag }}
          release_name: ${{ needs.preflight.outputs.tag }}
          overwrite: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.is_prerelease == 'true' && 'false' || 'legacy' }}

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.config.name }}-r${{ matrix.config.r }}
          path: manifest.json
          if-no-files-found: error

  # ===========================================================================
  # FINALIZE
  # Merges the per-build manifests (schema-validated) and attaches the result
  # to the GitHub Release.
  # ===========================================================================
  finalize:
    name: Publish manifest to release
    needs: [preflight, build-primary, build-bin]
    if: >-
      !cancelled() &&
      needs.build-primary.result == 'success' &&
      needs.build-bin.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download manifest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: ${{ github.workspace }}/manifests

      - name: Merge manifests
        id: merge
        uses: A2-ai/r-releaser/merge-manifests@feat/gh-compatibility
        with:
          manifest_dir: ${{ github.workspace }}/manifests

      - name: Upload manifest to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.merge.outputs.manifest_path }}
          asset_name: manifest.json
          tag: ${{ needs.preflight.outputs.tag }}
          release_name: ${{ needs.preflight.outputs.tag }}
          overwrite: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.is_prerelease == 'true' && 'false' || 'legacy' }}

  # ===========================================================================
  # DEPLOY
  # Publishes to PRISM using the org Actions secret PRISM_API_TOKEN_DEV. Runs
  # when the tag is not a prerelease, or when dispatched with publish: true.
  # ===========================================================================
  deploy:
    name: Deploy to PRISM
    needs: [preflight, build-primary, finalize]
    if: >-
      !cancelled() &&
      needs.finalize.result == 'success' &&
      (needs.preflight.outputs.is_prerelease != 'true' || inputs.publish == true)
    runs-on: ubuntu-latest
    concurrency:
      group: prism-deploy-${{ github.repository }}-${{ needs.preflight.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Publish release to PRISM
        uses: A2-ai/r-releaser/deploy-prism@feat/gh-compatibility
        with:
          prism_api_url: ${{ vars.PRISM_API_URL }}
          auth_token: ${{ secrets.PRISM_API_TOKEN_DEV }}
          release_tag: ${{ needs.preflight.outputs.tag }}
          no_sys_deps: true

  # ===========================================================================
  # DEPLOY-SKIPPED
  # Visible annotation when a prerelease (rc or dev version) skips the PRISM
  # deploy.
  # ===========================================================================
  deploy-skipped:
    name: Deploy skipped (prerelease)
    needs: [preflight, finalize]
    if: >-
      !cancelled() &&
      needs.finalize.result == 'success' &&
      needs.preflight.outputs.is_prerelease == 'true' &&
      inputs.publish != true
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          KIND: ${{ needs.preflight.outputs.is_rc == 'true' && 'a release candidate' || 'a development version' }}
        run: |
          echo "::notice::$TAG is $KIND — PRISM deploy skipped. To deploy it anyway run: gh workflow run release.yml --ref $TAG -f tag=$TAG -f publish=true (--ref runs the workflow baked at the tag and stamps the tag's commit into the deploy)"
