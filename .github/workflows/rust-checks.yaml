# Checks for the bundled pharos CLI (design/pharos-cli-bundling.md). The logic
# lives in .github/scripts/ so each check can be run locally from the repo root.
on:
  push:
    branches: main
  pull_request:
    branches: main

name: pharos-cli-checks

permissions: read-all

jobs:
  # Fails while the dev [patch] pointing pharos at a local checkout is present,
  # so the branch cannot merge until it is removed and Cargo.lock regenerated.
  no-dev-pharos-patch:
    name: No dev pharos patch (pre-merge gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No dev pharos patch
        run: bash .github/scripts/check-no-dev-pharos-patch.sh src/rust

  cli-dep-graph:
    name: pharos CLI has no R dependencies (I1)
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: hyperion-pharos-cli does not depend on extendr / libR-sys
        run: bash .github/scripts/check-cli-dep-graph.sh src/rust/Cargo.toml

  # Plant the outputs a local `R CMD INSTALL .` leaves behind; the built
  # tarball must still come out clean.
  source-tarball:
    name: Source tarball has no binaries (I5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Plant build outputs of a local install
        run: |
          mkdir -p inst/bin src/rust/target/release
          for f in src/pharos src/pharos.exe inst/bin/pharos src/rust/target/release/pharos; do
            cp "$(type -P true)" "$f"
          done
          touch src/pharos-cli-skipped

      # Bypass the repo .Rprofile (it activates rv, which is not installed here).
      - name: Build source tarball
        run: |
          touch "$RUNNER_TEMP/empty.Rprofile"
          R_PROFILE_USER="$RUNNER_TEMP/empty.Rprofile" R CMD build --no-build-vignettes --no-manual --no-resave-data .

      - name: Source tarball has no binaries and no inst/bin
        run: bash .github/scripts/check-source-tarball.sh hyperion_*.tar.gz
