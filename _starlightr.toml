[site]
title = "hyperion"
description = "Hyperion is an R interface to the pharos CLI for"

[output]
dir = "../Docs/hyperion-docs"

[versions]
enabled = true
list = [{ tag = "0.1.1", label = "v0.1.1", default = true }]

[home]
hero = { actions = [
	{ text = "Get Started", link = "./articles/readme/", icon = "right-arrow", variant = "primary" },
	{ text = "View on GitHub", link = "https://github.com/A2-ai/hyperion", icon = "external", variant = "minimal" },
] }
cards = [
	{ icon = "document", title = "Model Interaction", description = "hyperion has several functions for interacting with NONMEM models", link = "./reference/read_model/" },
	{ icon = "seti:csv", title = "Parameter Tables", description = "hyperion can create model parameter tables", link = "./articles/parameter-tables/" },
]

[sidebar]
articles = [
	{ label = "Getting Started", contents = [
		{ slug = "README", label = "Welcome" },
	] },
	{ label = "Output File Parsing", contents = [
		"ext",
		"grd",
		"shk",
		"lst",
	] },
	{ label = "NONMEM Model Interactions", contents = [
		"hyperion_model",
	] },
	{ label = "Parameter Tables", contents = [
		"parameter-tables",
	] },
]
reference = [
	{ label = "Models", contents = [
		"read_model",
		"check_model",
		"check_dataset",
		"copy_model",
		{ slug = "summary.hyperion_nonmem_model", label = "summary" },
		"get_run_info",
