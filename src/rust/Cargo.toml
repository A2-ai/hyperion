[package]
name = 'hyperion'
publish = false
version = '0.1.0'
edition = '2024'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'hyperion'
path = 'lib.rs'

[[bin]]
name = 'document'
path = 'document.rs'

[workspace]
members = ["nonmem", "scheduler", "core", "pharos-cli"]

[dependencies]
# Internal crates
hyperion-nonmem = { path = "nonmem" }
hyperion-scheduler = { path = "scheduler" }
hyperion-core = { path = "core" }

# R Integration
extendr-api = { workspace = true }

# Pharos components (for init module)
config = { workspace = true }

# Core utilities
toml = { workspace = true }
fs-err = { workspace = true }
serde = { workspace = true }

[workspace.dependencies]
# R Integration
extendr-api = { version = "0.9.0", features = ["serde"] }

# Pharos components
pharos = { git = "https://github.com/a2-ai/pharos", package = "pharos", tag = "v0.6.0" }
nonmem = { git = "https://github.com/a2-ai/pharos", package = "nonmem", tag = "v0.6.0" }
nmparser = { git = "https://github.com/a2-ai/pharos", package = "nonmem-parser", tag = "v0.6.0" }
config = { git = "https://github.com/a2-ai/pharos", package = "config", tag = "v0.6.0" }
scheduler = { git = "https://github.com/a2-ai/pharos", package = "scheduler", tag = "v0.6.0" }

# Core utilities
anyhow = "1.0.100"
fs-err = "3.1.2"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1"
toml = "0.9.7"

# Testing and utilities
tempfile = "3.23.0"

# DEV ONLY: before merge, delete this [patch] section, bump all pharos
# tags to v0.6.1, and regenerate Cargo.lock so no pharos crate is path-sourced.
# Absolute paths so builds from a copied source tree (rv, R CMD build) still resolve.
[patch."https://github.com/a2-ai/pharos"]
pharos = { path = "/Users/wescummings/projects/pharos" }
nonmem = { path = "/Users/wescummings/projects/pharos/components/nonmem" }
nonmem-parser = { path = "/Users/wescummings/projects/pharos/components/nonmem-parser" }
config = { path = "/Users/wescummings/projects/pharos/components/config" }
scheduler = { path = "/Users/wescummings/projects/pharos/components/scheduler" }

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = { workspace = true }
